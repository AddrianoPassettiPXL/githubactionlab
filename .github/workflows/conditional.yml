
name: conditional

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Welke environment?
        required: true
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  iftest:
    runs-on: ubuntu-latest

    env:
      INPUT: ${{ github.event.inputs.environment }}

    steps:
      - name: productie ja nee
        if: env.INPUT == 'production'
        run: echo "Deploying to production!"

      - name: geen productie
        if: env.INPUT == 'staging' || env.INPUT == 'development'
        run: echo "Running in test mode"

      - name: run als laatste
        run: echo "dit is de env $INPUT"
